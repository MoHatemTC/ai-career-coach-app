name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scaffold-check:
    name: Scaffold Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files and folders
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .env.example
          test -f docs/PRD.md
          test -d backend
          test -d frontend
          test -d data
          test -d scripts
          test -d docs
