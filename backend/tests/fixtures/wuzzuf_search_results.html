<!DOCTYPE html>
<!-- Static snapshot of the Wuzzuf search-results DOM shape the scraper
     relies on: h2 > a[href^="/jobs/p/"] for the title link, a sibling
     div holding company/location/posted-time, and the next sibling of
     the h2's parent holding the tag chips (skills mixed with job-type,
     work-mode, career-level, and experience chips). -->
<html>
<body>
  <div class="job-card">
    <div class="job-card-header">
      <h2><a href="/jobs/p/111-senior-python-developer-cairo">Senior Python Developer</a></h2>
      <div>
        <a href="/company/techcorp">TechCorp -</a>
        <span>Cairo, Egypt</span>
        <div>5 days ago</div>
      </div>
    </div>
    <div class="job-card-tags">
      <a>Full Time</a>
      <span>·</span>
      <span>On-site</span>
      <a>Experienced</a>
      <span>5 - 10 Yrs of Exp</span>
      <a>Python</a>
      <a>Django</a>
      <a>PostgreSQL</a>
    </div>
  </div>
  <div class="job-card">
    <div class="job-card-header">
      <h2><a href="/jobs/p/222-marketing-manager-giza">Marketing Manager</a></h2>
      <div>
        <a href="/company/adhouse">AdHouse -</a>
        <span>Giza, Egypt</span>
        <div>2 hours ago</div>
      </div>
    </div>
    <div class="job-card-tags">
      <a>Part Time</a>
      <span>Remote</span>
      <a>Manager</a>
      <span>10+ Yrs of Exp</span>
      <a>SEO</a>
      <a>Content Marketing</a>
    </div>
  </div>
</body>
</html>
