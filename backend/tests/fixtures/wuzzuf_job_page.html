<!DOCTYPE html>
<!-- Static snapshot of a Wuzzuf job page: the description lives in a
     schema.org JobPosting JSON-LD block, with the page meta description
     as a weaker fallback. -->
<html>
<head>
  <meta name="description" content="Meta fallback description for the job.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "Senior Python Developer",
    "description": "<p>We are hiring a <strong>Senior Python Developer</strong> to build our ingestion pipeline.</p><p>Requirements: 5+ years Python, Django, PostgreSQL.</p>",
    "hiringOrganization": { "@type": "Organization", "name": "TechCorp" }
  }
  </script>
</head>
<body>
  <h1>Senior Python Developer</h1>
</body>
</html>
