services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: career_coach_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - .:/app

  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    container_name: career_coach_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    volumes:
      - .:/app

  qdrant:
    image: qdrant/qdrant:latest
    container_name: career_coach_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
